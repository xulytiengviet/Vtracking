name: Fleet Logistics tests
on:
  push:
    paths: ['fleet-logistics/**', '.github/workflows/fleet-logistics.yml']
  pull_request:
    paths: ['fleet-logistics/**', '.github/workflows/fleet-logistics.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-logistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/board.js
      - run: python -m py_compile domain.py server.py
      - run: node pages/test-demo.cjs
      - run: node --check pages/pages.js
      - run: python pages/build.py && git diff --exit-code -- ../index.html
