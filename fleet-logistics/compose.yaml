services:
  logistics:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8090}
      TRACCAR_URL: ${TRACCAR_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - logistics-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  logistics-data:
